[project]
name = "stackforge-api"
version = "0.1.0"
description = "StackForge API — AI engineering workbench"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "email-validator>=2.2",
    # persistence
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "greenlet>=3.1",
    # cache / queue
    "redis>=5.2",
    # auth
    "argon2-cffi>=23.1",
    "pyjwt[crypto]>=2.10",
    "uuid7>=0.1",
    # observability
    "structlog>=24.4",
    # outbound
    "httpx>=0.28",
    # Windows has no system tz database; zoneinfo (and Alembic's timestamped
    # revision files) need this.
    "tzdata>=2024.2",
    "pypdf>=6.15.0",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    # WF3 validates every generated function schema against the real thing.
    # "looks like JSON Schema" is the check that lets an invalid tool
    # definition reach the provider, where it fails opaquely days later.
    "jsonschema>=4.23",
    # M16. Synthesis runs on Groq. The SDK is a hard dependency even though the
    # key is optional — the module must import and degrade, not fail to import.
    "groq>=0.11",
    # Not for generation. `anthropic:api` is the only accurate token count for
    # a Claude row in the model catalogue, and `count_tokens` is the endpoint
    # that gives it. Same rule: hard dependency, optional key.
    "anthropic>=0.69",
    # Real token counts. `tiktoken` for OpenAI encodings, `tokenizers` for the
    # open-weight models, both replacing ceil(chars / 4).
    "tiktoken>=0.8",
    "tokenizers>=0.21",
    # M18. Markdown is the source format for every generated document, so both
    # PDF backends start from it: `markdown` renders the HTML the Chromium
    # backend prints, and the ReportLab backend walks the same tokens. Neither
    # dependency is optional — the module must import and pick a backend, not
    # fail to import (the same rule the AI SDK follows).
    #
    # Playwright is deliberately *not* here. It is the recommended production
    # backend (Q-01) and it costs a ~400 MB image, so it is installed in the
    # PDF worker image only; `pdf_service` falls back to ReportLab and says so
    # in the logs when it is absent.
    "markdown>=3.7",
    "reportlab>=4.2",
    # D-05, finally used: bundle generation and the export purge are the first
    # work in this program that does not belong inside a request.
    "arq>=0.26",
    # M20. Same rule as the AI SDK: a hard dependency with an optional key. The
    # billing module has to import and degrade to "checkout unavailable" when
    # the Razorpay keys are unset, because local development and CI both run
    # without them — and the webhook signature verifier is needed even in the
    # tests that never talk to Razorpay.
    "razorpay>=2.0.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "fakeredis>=2.26",
    "time-machine>=2.16",
    "ruff>=0.8",
    "mypy>=1.13",
    "asgi-lifespan>=2.1",
    "types-pyyaml>=6.0.12.20260724",
    "kubernetes>=36.0.3",
    # The generated MCP server is started in a subprocess and handshaked
    # against. A generator whose output does not run is a demo, and the only
    # way to know it runs is to run it.
    "mcp>=1.9",
    "types-jsonschema>=4.23",
    "types-markdown>=3.10.2.20260712",
    "types-reportlab>=4.5.1.20260807",
]

[tool.uv]
package = false

# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "N",         # pep8-naming
    "UP",        # pyupgrade
    "B",         # bugbear
    "C4",        # comprehensions
    "SIM",       # simplify
    "RUF",       # ruff-specific
    "ASYNC",     # async correctness
    "S",         # bandit — this is an auth service
]
ignore = [
    "S101",   # assert — used throughout the test suite
    "B008",   # function call in default arg — this is how FastAPI Depends works
    # The error classes are a taxonomy read at call sites (`raise NotFound()`,
    # `raise Conflict()`). An "Error" suffix on all sixteen adds noise, not
    # information.
    "N818",
    # `class X(str, Enum)` is what SQLAlchemy's Enum(values_callable=...) and
    # Pydantic are wired against here. StrEnum is the modern idiom but the
    # swap is churn with a serialization risk and no benefit.
    "UP042",
    # PEP 695 generics on a Pydantic BaseModel still have rough edges.
    "UP046",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]  # hardcoded test credentials are the point
# S105 flags enum *members* named PASSWORD_RESET as hardcoded passwords.
"app/models/auth.py" = ["S105"]

# Raw string SQL is a lint failure, not a code-review catch. SQLAlchemy binds
# parameters; a formatted string does not.
[tool.ruff.lint.flake8-bandit]
check-typed-exception = true

# ---------------------------------------------------------------------------

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/versions/"]

[[tool.mypy.overrides]]
# `playwright` is deliberately absent from the runtime dependencies — it is the
# PDF worker image's, not the API's — so the import inside `pdf_service` is
# unresolvable here by design rather than by omission.
#
# `razorpay` ships no `py.typed`, which is why `integrations/razorpay.py`
# declares a narrow Protocol over it: the boundary is typed even though the SDK
# behind it is not, so nothing untyped escapes past that module.
module = [
    "fakeredis.*",
    "uuid_extensions.*",
    "asgi_lifespan.*",
    "playwright.*",
    "razorpay.*",
]
ignore_missing_imports = true

# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.coverage.run]
source = ["app"]
# SQLAlchemy's async layer runs handler code inside greenlets. Without this,
# coverage silently reports well-tested service functions as unexecuted, which
# makes the whole number untrustworthy.
concurrency = ["greenlet", "thread"]
omit = ["app/main.py", "*/__init__.py"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
